<!DOCTYPE html>
<html lang="fr" data-theme="light" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>3C — Cadre de Concertation Citoyenne</title>
  <meta name="description" content="Le Cadre de Concertation Citoyenne (3C) œuvre pour l'inclusion sociale, l'autonomisation et la participation active des personnes en situation de handicap au Sénégal.">
  <meta name="theme-color" content="#005f73">
  <link rel="icon" href="assets/img/brand/logo-3c-mark.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/brand/logo-3c-mark.png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="3C — Cadre de Concertation Citoyenne">
  <meta property="og:description" content="Pour une citoyenneté inclusive, sans distinction ni exclusion.">
  <meta property="og:image" content="assets/img/brand/logo-3c.png">
  <meta property="og:locale" content="fr_SN">

  <!-- Applique le thème enregistré AVANT le rendu, pour éviter un flash de couleur -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('3c-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
      document.documentElement.classList.remove('no-js');
      document.documentElement.classList.add('is-loading');
    })();
  </script>


  <!-- Voile de chargement : styles en ligne pour qu'il peigne dès le premier
       octet, avant même l'arrivée des feuilles externes. -->
  <style>
    .preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #ffffff;
      clip-path: inset(0 0 0 0);
      transition: clip-path .9s cubic-bezier(.76, 0, .24, 1);
    }

    :root[data-theme="dark"] .preloader { background: #061419; }

    .preloader__inner {
      display: grid;
      justify-items: center;
      gap: 1.5rem;
      transition: opacity .4s ease, transform .4s ease;
    }

    .preloader__mark {
      position: relative;
      display: grid;
      place-items: center;
      width: 168px;
      height: 168px;
    }

    .preloader__mark img {
      width: 86px;
      height: 86px;
      object-fit: contain;
    }

    /* Anneau de progression, aux couleurs de la charte */
    .preloader__ring {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    .preloader__ring circle {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .preloader__track { stroke: #e2eaeb; }

    :root[data-theme="dark"] .preloader__track { stroke: #1e343c; }

    .preloader__bar {
      stroke: url(#preloaderGradient);
      stroke-dasharray: 339.3;              /* 2 pi r, r = 54 */
      stroke-dashoffset: 339.3;
      transition: stroke-dashoffset .45s cubic-bezier(.3, .7, .3, 1);
    }

    .preloader__label {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: .6875rem;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #64787f;
      font-variant-numeric: tabular-nums;
    }

    /* Sortie : le voile se retire vers le haut */
    .preloader.is-done {
      clip-path: inset(0 0 100% 0);
      pointer-events: none;
    }

    .preloader.is-done .preloader__inner {
      opacity: 0;
      transform: translateY(-12px);
    }

    /* Tant que le voile est là, la page ne défile pas */
    :root.is-loading body { overflow: hidden; }

    /* Entrée échelonnée du hero, une fois le voile retiré */
    .hero__enter > * {
      opacity: 0;
      transform: translateY(20px);
    }

    body.is-ready .hero__enter > * {
      opacity: 1;
      transform: none;
      transition: opacity .7s cubic-bezier(.2, .7, .3, 1),
                  transform .7s cubic-bezier(.2, .7, .3, 1);
    }

    body.is-ready .hero__enter > *:nth-child(1) { transition-delay: .05s; }
    body.is-ready .hero__enter > *:nth-child(2) { transition-delay: .16s; }
    body.is-ready .hero__enter > *:nth-child(3) { transition-delay: .27s; }
    body.is-ready .hero__visual { animation: hero-in .9s .2s cubic-bezier(.2, .7, .3, 1) both; }

    @keyframes hero-in {
      from { opacity: 0; transform: scale(.94); }
      to   { opacity: 1; transform: none; }
    }

    /* Sans script, le voile ne doit jamais bloquer la page */
    .no-js .preloader { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .preloader { transition: opacity .2s linear; }
      .preloader.is-done { clip-path: none; opacity: 0; }
      .hero__enter > *, body.is-ready .hero__visual {
        opacity: 1;
        transform: none;
        animation: none;
      }
    }
  </style>

  <!-- Polices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Feuilles de style (l'ordre compte) -->
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/sections.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body>
  <!-- =========================================================================
       VOILE DE CHARGEMENT
       Seul bloc écrit en dur dans le corps : il doit peindre avant tout le
       reste. Retiré par assets/js/preloader.js une fois les visuels prêts.
  ========================================================================== -->
  <div class="preloader" id="preloader" role="status" aria-label="Chargement du site">
    <div class="preloader__inner">
      <div class="preloader__mark">
        <svg class="preloader__ring" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="preloaderGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#005f73"></stop>
              <stop offset="55%" stop-color="#0a9396"></stop>
              <stop offset="100%" stop-color="#ee9b00"></stop>
            </linearGradient>
          </defs>
          <circle class="preloader__track" cx="60" cy="60" r="54"></circle>
          <circle class="preloader__bar" id="preloaderBar" cx="60" cy="60" r="54"></circle>
        </svg>
        <img src="assets/img/brand/logo-3c-mark.png" alt="" width="86" height="86">
      </div>
      <p class="preloader__label"><span id="preloaderPercent">0</span>&thinsp;%</p>
    </div>
  </div>

  <a class="skip-link" href="#main" data-i18n="skip"></a>
  <div class="progress-bar" id="progressBar" aria-hidden="true"></div>

  <!-- =========================================================================
       COMPOSANTS
       Chaque emplacement est remplacé par components/<nom>.html au chargement
       (assets/js/include.js). Pour déplacer une section, il suffit de déplacer
       la ligne correspondante.
  ========================================================================== -->
  <div data-component="header"></div>

  <main id="main">
    <div data-component="hero"></div>
    <div data-component="about"></div>
    <div data-component="services"></div>
    <div data-component="stats"></div>
    <div data-component="realisations"></div>
    <div data-component="gallery"></div>
    <div data-component="testimonials"></div>
    <div data-component="team"></div>
    <div data-component="partners"></div>
    <div data-component="faq"></div>
    <div data-component="contact"></div>
  </main>

  <div data-component="footer"></div>
  <div data-component="overlays"></div>

  <!-- Scripts (l'ordre compte) -->
  <script src="assets/js/preloader.js" defer></script>
  <script src="assets/js/content.js" defer></script>
  <script src="assets/js/translations.js" defer></script>
  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/include.js" defer></script>
  <script src="assets/js/render.js" defer></script>
  <script src="assets/js/theme.js" defer></script>
  <script src="assets/js/navigation.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/parallax.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
