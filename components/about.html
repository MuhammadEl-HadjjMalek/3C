<!-- À propos : chapeau puis damier vision / mission / valeurs -->
<section class="section section--light" id="apropos">
  <div class="container">

    <div class="section-title">
      <h2 data-i18n="about.title"></h2>
      <p data-i18n="about.subtitle"></p>
    </div>

    <div class="section-lede">
      <p data-i18n="about.p1"></p>
      <p data-i18n="about.p2"></p>
    </div>

    <!-- Damier : trois énoncés alternés avec trois photos de terrain -->
    <div class="mosaic reveal">

      <article class="mosaic__item">
        <span class="mosaic__num">01</span>
        <h3 data-i18n="about.vision.title"></h3>
        <p data-i18n="about.vision.desc"></p>
      </article>

      <figure class="mosaic__shot">
        <img src="assets/img/gallery/activite-06.jpg" alt="" data-i18n-alt="about.shot1Alt" loading="lazy">
      </figure>

      <article class="mosaic__item">
        <span class="mosaic__num">02</span>
        <h3 data-i18n="about.mission.title"></h3>
        <p data-i18n="about.mission.desc"></p>
      </article>

      <figure class="mosaic__shot">
        <img src="assets/img/gallery/activite-04.jpg" alt="" data-i18n-alt="about.shot2Alt" loading="lazy">
      </figure>

      <article class="mosaic__item">
        <span class="mosaic__num">03</span>
        <h3 data-i18n="about.values.title"></h3>
        <p data-i18n="about.values.desc"></p>
      </article>

      <figure class="mosaic__shot">
        <img src="assets/img/gallery/activite-01.jpg" alt="" data-i18n-alt="about.shot3Alt" loading="lazy">
      </figure>

    </div>
  </div>
</section>
