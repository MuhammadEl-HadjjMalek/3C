<!-- Témoignages : une citation à la fois, montées par App.ui -->
<section class="section" id="temoignages">
  <div class="container">

    <div class="section-title">
      <h2 data-i18n="testimonials.title"></h2>
      <p data-i18n="testimonials.subtitle"></p>
    </div>

    <figure class="quotes">
      <span class="quotes__mark" aria-hidden="true">&ldquo;</span>

      <div class="quotes__body" id="quoteBody">
        <blockquote id="quoteText" aria-live="polite"></blockquote>
        <figcaption class="quotes__author" id="quoteAuthor"></figcaption>
      </div>

      <div class="quotes__dots" id="quoteDots" role="tablist" data-i18n-aria="testimonials.chooseAria"></div>
    </figure>

  </div>
</section>
